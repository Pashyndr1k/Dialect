id: kling-3-omni
label: Kling 3.0 Omni
vendor: kuaishou
family: video
syntax: field-list
renderer: field-list
header: Kling 3.0 prompt

bestFor:
  - performance_cloning
  - on_product_text
  - physics
  - character_continuity
  - dialogue
routingNote: >-
  Holds product copy correct while things move, and clones a performance from a
  reference clip. Pick it when the shot lives or dies on text or acting.

# The nine-field formula, as data rather than code. Order is mandatory and
# nothing is skipped: a field that does not apply gets a deliberate minimal
# value, which is what `fallback` is for.
#
# `from` lists the IR paths that feed a field, in the order they should read.
# `[]` means each item of an array. A leading `@` is one of the few computed
# phrases the renderer knows, for lines that are word order rather than a field.
fields:
  - name: Subject
    # The headline if there is one; failing that, whatever is in frame.
    from: ["subject.headline", "subject.entities[].name"]
    mode: first

  - name: SubjectDescription
    # Repeated in full every time. Abbreviating this is what breaks a character
    # across separate generations.
    from: ["subject.entities[].description"]
    join: " "
    fallback: as the subject line describes

  - name: Movement
    from: [subject.action]

  - name: Scene
    from: [environment.location, environment.timeOfDay]

  - name: SceneDescription
    from: [environment.description]
    fallback: minimal context

  - name: Camera
    from: [shot.framing, shot.angle, "@cameraMove", "@lens"]

  - name: Lighting
    from:
      - lighting.key
      - "lighting.sources[]"
      - lighting.contrast
      - lighting.colorTemp
      - lighting.quality
      - lighting.direction
      - "lighting.lookWords[]"

  - name: Atmosphere
    from: [mood.atmosphere, mood.emotion, mood.energy]
    fallback: neutral

  - name: Negative
    from: ["constraints.avoid[]"]
    role: negative

limits:
  durationS: 15
  maxRes: "4K"

supports:
  negativePrompt: true
  nativeAudio: true
  lipSync: true
  startEndFrame: true
  emitsGearNumbers: true   # the Camera line conventionally carries a lens

defaults:
  sound.music: false
  sound.subtitles: false

rules:
  - one-action-one-move
  - max-tracked-entities
  - max-look-words
  - emotions-are-physical
  - only-visible-and-audible
  - exit-frame-means-gone
  - skin-realism-block

source:
  name: kling_prompt.md (kling-3-prompt-director)
  dated: "2026-06-19"

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Three installers take twenty minutes of runner time. A failing test costs
  # thirty seconds to find out about, so the tests go first and everything else
  # waits on them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The host tests run on a platform this app actually ships to.
  #
  # They were on ubuntu at first, which fails: the crate pulls in Tauri, and
  # Tauri on Linux wants a GTK and WebKit development stack. Installing all of
  # that to compile a crate for a platform nobody runs is a strange way to find
  # out whether a hash check works. Windows is a target, needs nothing, and is
  # where every version of this has been built.
  #
  # In parallel with the TypeScript half rather than after it, because neither
  # tells you anything about the other.
  rust:
    runs-on: windows-latest
    # It gates again.
    #
    # It did not, for four releases, because these tests passed on the machine
    # they were written on and failed here, and job logs need admin rights on
    # the repository that nobody working on this has. Annotations do not need
    # them, so the steps below turn the failure into annotations — and the
    # first run that had them said, in one line, what a fortnight of guessing
    # had not: two tests, both racing Windows over a directory.
    #
    # A fixed temporary path emptied and remade is the bug. Windows schedules a
    # directory's deletion and finishes it when the last handle closes, so
    # recreating it immediately can hand back one that is on its way out. Both
    # test modules did it, and so did the installer itself.
    #
    # A gate nobody can explain is worse than no gate, because it teaches
    # people to ignore red. This one can be explained now.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-test

      # Split so the step *name* narrows it before anything has to be read: the
      # build job compiles this crate happily but never compiles its tests, so
      # "compile" failing and "run" failing mean quite different things.
      - name: Compile the host tests
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          out=$(cargo test --lib --no-run 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0
          echo "$out" | tail -30 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code

      # ffmpeg is not on the runner; the tests that want it say so and skip.
      - name: Run the host tests
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          set +e
          out=$(cargo test --lib 2>&1); code=$?
          echo "$out"
          [ $code -eq 0 ] && exit 0

          # Which tests failed, by name, first. A blind tail can push the
          # summary off the end exactly when there is most to say, and the
          # names are the one thing worth reading before anything else.
          echo "$out" | grep -E '^\s+[a-z_]+::' | sort -u \
            | while IFS= read -r t; do echo "::error title=Failed test::$(echo "$t" | tr -d '[:space:]')"; done
          echo "$out" | grep -E '^test result:' \
            | while IFS= read -r line; do echo "::error::${line}"; done
          echo "$out" | tail -30 | while IFS= read -r line; do echo "::error::${line}"; done
          exit $code

  # Draft first, publish last.
  #
  # An uploader that finds the tag's release already published can skip its
  # assets while still reporting success — which is how a release ships without
  # half its installers and nobody notices. So the release is put into DRAFT
  # before the matrix, every platform uploads into that same draft by id, and
  # one job at the end flips it live: the whole set appears at once or not at
  # all.
  release:
    needs: [check, rust]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: draft
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const matches = all.filter((r) => r.tag_name === tag);

            if (!matches.length) {
              const made = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: tag.replace(/^v/, ''), draft: true,
                body: 'Installers are uploading.',
              });
              return String(made.data.id);
            }

            // Keep whichever holds the most assets, draft it so the builders
            // can upload into it, and delete stray duplicates of the same tag.
            matches.sort((a, b) => b.assets.length - a.assets.length);
            const keep = matches[0];
            await github.rest.repos.updateRelease({ owner, repo, release_id: keep.id, tag_name: tag, draft: true });
            for (const extra of matches.slice(1)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: extra.id });
            }
            return String(keep.id);

  build:
    needs: [check, rust, release]
    # A manual run skips the release job and still builds, so three platforms
    # can be checked without cutting a tag to find out whether they compile.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.rust.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      # One platform failing must not cancel the others: a Windows installer is
      # worth having even on a day macOS will not build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          # macos-15-intel is the x64 label; macos-14 is Apple Silicon. Built
          # natively on each rather than as one universal binary — nothing here
          # needs to be a single file, and a native build is one less thing that
          # can fail in a way nobody can reproduce.
          - os: macos-15-intel
            name: macos-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}
      - run: npm ci

      # ffmpeg travels with the app so a machine that has never heard of it can
      # still read a clip. Pinned and licence-checked in the script rather than
      # here — see scripts/fetch-ffmpeg.sh, which explains why that matters.
      # Run through bash rather than as ./script, because the executable bit
      # is a thing git tracks and a thing that is easy to lose — and losing it
      # fails only on macOS, where the mode is respected, which is exactly the
      # platform that is hardest to check before pushing.
      - name: Fetch the ffmpeg that ships with it
        shell: bash
        run: bash ./scripts/fetch-ffmpeg.sh ${{ matrix.name }}

      # Split into steps on purpose.
      #
      # This was one call to tauri-action, which failed on all three platforms
      # including the one where `npx tauri build` demonstrably works. Job logs
      # need repo admin and this repository's owner is not me, so a single
      # opaque step that fails is a step I cannot learn anything from — whereas
      # step *names* are public, and three named steps say which third broke.
      #
      # These are the commands that were run by hand before any of this was
      # written, which is a better thing to depend on than an action whose
      # inputs I inferred from a list.
      # Signs each installer so the updater can tell ours from anyone else's.
      #
      # This said the build "still succeeds and simply produces no signatures"
      # without the secret. That was an assumption written down as a fact, and
      # it is wrong: a configured `plugins > updater > pubkey` with no private
      # key is a hard error — "A public key has been found, but no private key"
      # — ten minutes into the build, on every platform.
      #
      # So the absence is handled rather than discovered. Without the secret the
      # installers are built without updater artifacts and the run says, in a
      # warning anyone can read, that this release cannot update itself.
      - name: Build the installers
        shell: bash
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build
          else
            echo "::warning title=No signing key::TAURI_SIGNING_PRIVATE_KEY is not set, so these installers are unsigned and this release ships without an update manifest. Installed copies will not update themselves to it."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: List what was built
        shell: bash
        run: find apps/desktop/src-tauri/target/release/bundle -type f | sed 's/^/  /'

      - name: Upload into the draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Only the things a person would install. The bundle tree also holds
          # unpacked app directories and intermediate artefacts.
          #
          # Read in a loop rather than with `mapfile`, which is bash 4 and
          # therefore absent on macOS: Apple still ships 3.2. That is why both
          # mac jobs failed here while Windows, on git bash, uploaded fine —
          # the builds were finished and correct, and the shell could not hold
          # the list of what they had made.
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(
            find apps/desktop/src-tauri/target/release/bundle -type f \
              \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \)
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing to upload from this platform." >&2
            exit 1
          fi
          echo "uploading:"
          for f in "${files[@]}"; do echo "  $f"; done
          gh release upload "$tag" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dialect-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg

  # Live only once every platform has finished uploading.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const id = Number('${{ needs.release.outputs.id }}');
            const { owner, repo } = context.repo;
            const { data: rel } = await github.rest.repos.getRelease({ owner, repo, release_id: id });

            console.log('Assets:', rel.assets.map((a) => a.name).join(', ') || '(none)');
            // A draft with nothing in it is better than a published release
            // with nothing in it: the first can be retried, the second has to
            // be explained.
            if (!rel.assets.length) throw new Error('Nothing was uploaded; leaving the draft alone.');

            /*
             * The manifest the running app reads to learn a new version exists.
             *
             * Built from what was actually uploaded rather than from a list
             * written down somewhere: a manifest naming a file that is not
             * there is an update that fails for everyone, silently, and only
             * on the machines that already had the app.
             *
             * A platform with no signature is left out entirely. An unsigned
             * entry is not a lesser update, it is an update the app will refuse
             * — better to offer nothing than to offer something that cannot be
             * checked.
             */
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const byName = new Map(rel.assets.map((a) => [a.name, a]));

            // Which uploaded installer belongs to which platform the updater
            // knows about. The keys are Tauri's own names for them.
            const wanted = [
              ['windows-x86_64', (n) => n.endsWith('-setup.exe')],
              ['darwin-x86_64', (n) => n.includes('x64') && n.endsWith('.app.tar.gz')],
              ['darwin-aarch64', (n) => n.includes('aarch64') && n.endsWith('.app.tar.gz')],
            ];

            const platforms = {};
            for (const [key, matches] of wanted) {
              const asset = rel.assets.find((a) => matches(a.name));
              if (!asset) continue;

              const sig = byName.get(`${asset.name}.sig`);
              if (!sig) {
                console.log(`${key}: ${asset.name} has no signature, leaving it out`);
                continue;
              }

              // The signature is small and its text is what goes in the
              // manifest, not a link to it.
              const signature = await github.request(sig.url, {
                headers: { accept: 'application/octet-stream' },
              });
              platforms[key] = {
                signature: Buffer.from(signature.data).toString('utf8').trim(),
                url: asset.browser_download_url,
              };
            }

            if (Object.keys(platforms).length === 0) {
              console.log('No signed installers, so no update manifest. The release still ships.');
            } else {
              const manifest = {
                version,
                notes: `Dialect ${version}`,
                pub_date: new Date().toISOString(),
                platforms,
              };
              console.log('Manifest covers:', Object.keys(platforms).join(', '));

              // Replaced rather than added to, so re-running a release does not
              // leave two manifests disagreeing about what the latest version is.
              const old = byName.get('latest.json');
              if (old) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: id,
                name: 'latest.json',
                data: JSON.stringify(manifest, null, 2),
              });
            }

            await github.rest.repos.updateRelease({ owner, repo, release_id: id, draft: false, make_latest: 'true' });
